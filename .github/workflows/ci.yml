# Tipi, formattazione, build di produzione e Playwright a ogni push e PR.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Dipendenze dello Studio
        run: npm ci --prefix studio

      - name: Schemi di Sanity
        run: npm --prefix studio run validate

      - name: Tipi delle query aggiornati
        run: npm run typegen && git diff --exit-code src/content/sanity.types.ts

      - name: Browser di Playwright
        run: npx playwright install --with-deps chromium

      - name: Tipi
        run: npm run typecheck

      - name: Formattazione
        run: npm run format:check

      - name: Build di produzione
        # fino al Task 7 di M1 (dataset vero importato) la build legge il dataset di prova
        run: CONTENT_SOURCE=fixture npm run build

      - name: Niente lab nella build
        run: node scripts/check-dist.mjs

      - name: Test unitari
        run: npm run test:unit

      - name: Test
        run: npm test

      - name: Report di Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
